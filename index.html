<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>戦国七雄・都市開発シミュレーション</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./src/ui/styles.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="panel"></div>
<div id="toolbar" class="panel"></div>
<div id="demand" class="panel"></div>
<div id="panel-finance" class="panel bigpanel"></div>
<div id="panel-population" class="panel bigpanel"></div>
<div id="info" class="panel"></div>
<div id="view-menu" class="panel"></div>
<div id="view-legend" class="panel"></div>
<div id="view-tip"></div>
<div id="advisor"></div>
<div id="advisor-panel" class="panel bigpanel"></div>
<div id="log" class="panel"></div>
<div id="hint">左ドラッグ: ツールを適用 ／ 右ドラッグ: 回転 ／ 中ドラッグ・WASD: 移動 ／ ホイール: ズーム ／ Esc: 選択に戻る</div>
<div id="settings" class="panel"></div>
<div id="tooltip"></div>
<div id="error"></div>
<div id="start">
  <div class="card">
    <h1>戦国七雄・都市開発シミュレーション</h1>
    <p>前247年、秦王政が即位した年。あなたは一都市の県令として着任します。（フェーズ2: 経済・人口・税・暦と季節まで）</p>
    <label>仕える国</label><select id="start-nation"></select>
    <label>着任する都市</label><select id="start-city"></select>
    <div class="note" id="start-note"></div>
    <label>地形のシード（同じ値なら同じ地形）</label><input id="start-seed" type="text">
    <label>難易度</label><select id="start-difficulty"></select>
    <div class="note" id="start-diff-note"></div>
    <label>マップの大きさ</label><select id="start-size"><option value="128">128×128（小）</option><option value="192" selected>192×192（標準）</option><option value="256">256×256（大）</option></select>
    <button class="primary" id="start-btn">着任する</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
